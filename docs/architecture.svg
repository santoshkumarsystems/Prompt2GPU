<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14;ry:14}.title{font:700 24px system-ui;fill:#0f172a}.text{font:16px system-ui;fill:#334155}.small{font:14px system-ui;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style>
