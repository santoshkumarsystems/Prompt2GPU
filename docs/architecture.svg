<rect class="box" x="55" y="95" width="260" height="120"/><text x="185" y="132" text-anchor="middle" class="title">Load Generators</text><text x="185" y="165" text-anchor="middle" class="text">baseline · concurrency · context</text><text x="185" y="190" text-anchor="middle" class="small">controlled prompts / exact token counts</text>
